<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reelwright</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header><h1>Reelwright</h1><nav id="nav" hidden>
  <span id="who"></span><span id="usage"></span><button id="logout" class="ghost">Sign out</button></nav></header>
<main>
<section id="auth" hidden>
  <h2 id="auth-title">Sign in</h2>
  <form id="auth-form">
    <label>Email <input name="email" type="email" required autocomplete="username"></label>
    <label>Password <input name="password" type="password" required minlength="10" autocomplete="current-password"></label>
    <button type="submit">Continue</button>
    <button type="button" id="auth-toggle" class="ghost">Create an account instead</button>
    <p id="auth-error" class="error" role="alert"></p>
  </form>
</section>
<section id="app" hidden>
  <form id="job-form" class="card">
    <h2>New job</h2>
    <label>Video URL <input name="url" type="url" placeholder="https://…"></label>
    <label>…or upload a file <input name="file" type="file" accept="video/*,audio/*"></label>
    <div class="grid">
      <label>Clips <input name="max_clips" type="number" min="1" max="30" value="5"></label>
      <label>Min sec <input name="min_seconds" type="number" min="5" max="120" value="15"></label>
      <label>Max sec <input name="max_seconds" type="number" min="10" max="180" value="60"></label>
      <label>Captions <select name="caption_style"><option>classic</option><option>pop</option><option>boxed</option><option>none</option></select></label>
      <label>Layout <select name="layout"><option value="auto">auto</option><option>fill</option><option>fit_blur</option></select></label>
      <label>Platform <select name="platform"><option>shorts</option><option>tiktok</option><option>reels</option></select></label>
    </div>
    <label class="inline"><input name="use_llm" type="checkbox" checked> Use LLM ranking when configured</label>
    <button type="submit">Create clips</button>
    <p id="job-error" class="error" role="alert"></p>
  </form>
  <h2>Jobs</h2>
  <div id="jobs"></div>
</section>
</main>
<footer>Apache-2.0 · <a href="/api/docs">API docs</a></footer>
<script src="/app.js"></script>
</body>
</html>
