[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reelwright"
version = "0.1.0"
description = "Self-hostable AI video clipping: long video in, captioned vertical clips out."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Abhijeet Lasane and Reelwright contributors" }]
keywords = ["video", "clips", "shorts", "captions", "whisper", "ffmpeg"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "PyJWT>=2.8",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "opencv-python-headless>=4.9,<5",
]

[project.optional-dependencies]
download = ["yt-dlp>=2024.8.6"]
whisper = ["faster-whisper>=1.0"]
postgres = ["psycopg[binary]>=3.1"]
mcp = ["mcp[cli]>=1.30,<2"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
reelwright = "reelwright.cli:main"
reelwright-mcp = "reelwright.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reelwright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "E701", "E702"]  # FastAPI's Depends() in defaults is the intended style
